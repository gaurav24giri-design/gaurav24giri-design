
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Gaurav Giri premium developer profile">
<defs>
  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
