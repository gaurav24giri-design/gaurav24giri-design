      <text x="72" y="228">   ;  /  o  o  \  ;</text>
      <text x="72" y="244">   | |     ∆     | |</text>
      <text x="72" y="260">   ;  \  ___  /  ;</text>
      <text x="72" y="276">    \  '.___.'  /</text>
      <text x="72" y="292">     '._     _. '</text>
      <text x="72" y="308">       '-----'</text>
      <text x="72" y="336">       ╱╲  ╱╲</text>
